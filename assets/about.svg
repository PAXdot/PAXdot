<g class="l" style="animation-delay:0.25s"><rect x="34" y="98" width="3" height="40" fill="#ff1e8c"/><text x="52" y="124" fill="#ff1e8c" font-weight="700">[01]</text><text x="110" y="124" fill="#ffffff" font-weight="700">BUSINESS SYSTEMS</text><text x="290" y="124" fill="#c9d1d9">custom CRMs, invoicing, scheduling and reporting built around real operations</text><line x1="52" y1="147" x2="966" y2="147" stroke="#21262d" stroke-dasharray="3 5"/></g><g class="l" style="animation-delay:0.40s"><rect x="34" y="156" width="3" height="40" fill="#ff1e8c"/><text x="52" y="182" fill="#ff1e8c" font-weight="700">[02]</text><text x="110" y="182" fill="#ffffff" font-weight="700">MOBILE</text><text x="290" y="182" fill="#c9d1d9">native Android apps in Kotlin that put field teams on the same backend</text><line x1="52" y1="205" x2="966" y2="205" stroke="#21262d" stroke-dasharray="3 5"/></g><g class="l" style="animation-delay:0.55s"><rect x="34" y="214" width="3" height="40" fill="#ff1e8c"/><text x="52" y="240" fill="#ff1e8c" font-weight="700">[03]</text><text x="110" y="240" fill="#ffffff" font-weight="700">AUTOMATION</text><text x="290" y="240" fill="#c9d1d9">bots, scrapers and cron jobs that watch, notify and do the boring work</text><line x1="52" y1="263" x2="966" y2="263" stroke="#21262d" stroke-dasharray="3 5"/></g><g class="l" style="animation-delay:0.70s"><rect x="34" y="272" width="3" height="40" fill="#ff1e8c"/><text x="52" y="298" fill="#ff1e8c" font-weight="700">[04]</text><text x="110" y="298" fill="#ffffff" font-weight="700">WEB</text><text x="290" y="298" fill="#c9d1d9">fast multilingual sites designed to load instantly and convert</text><line x1="52" y1="321" x2="966" y2="321" stroke="#21262d" stroke-dasharray="3 5"/></g><g class="l" style="animation-delay:0.85s"><rect x="34" y="330" width="3" height="40" fill="#ff1e8c"/><text x="52" y="356" fill="#ff1e8c" font-weight="700">[05]</text><text x="110" y="356" fill="#ffffff" font-weight="700">INFRA</text><text x="290" y="356" fill="#c9d1d9">Linux, Nginx, PM2, CI/CD, monitoring and backups. I deploy what I build</text></g>
